<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>行動整合頁面 - MUJI 風格多功能儀表板</title>
  
  <!-- PWA Web App Manifest & Favicon -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <meta name="theme-color" content="#6e433b">

  <!-- Google Fonts: Noto Serif TC, Noto Sans TC, Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Remix Icons (via CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">

  <!-- Main CSS System (MUJI Morandi Slate Blue Theme v57) -->
  <link rel="stylesheet" href="css/index.css?v=57">
  <link rel="stylesheet" href="css/sidebar.css?v=57">
  <link rel="stylesheet" href="css/header.css?v=57">
  <link rel="stylesheet" href="css/workspace.css?v=57">
  <link rel="stylesheet" href="css/smoothjazz.css?v=57">
  <link rel="stylesheet" href="css/bulletin.css?v=57">
  <link rel="stylesheet" href="css/fund.css?v=57">
  <link rel="stylesheet" href="css/grades.css?v=57">
  <link rel="stylesheet" href="css/island.css?v=57">
  <link rel="stylesheet" href="css/productivity.css?v=57">
  <link rel="stylesheet" href="css/settings.css?v=57">
</head>
<body class="theme-dark">

  <!-- PWA 安裝引導橫幅 (PWA Install Prompt Banner) -->
  <div id="pwa-install-banner" class="pwa-install-banner" style="display:none;">
    <i class="ri-smartphone-line"></i>
    <span>安裝為手機 App，隨時快速開啟行動整合頁面</span>
    <button id="pwa-banner-install-btn" class="btn btn-primary btn-sm">立即安裝</button>
    <button id="pwa-banner-dismiss-btn" class="pwa-banner-dismiss">
      <i class="ri-close-line"></i>
    </button>
  </div>

  <div id="app" class="app-layout">
    
    <!-- 左側控制側邊欄 Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">
          <i class="ri-dashboard-3-line logo-icon"></i>
          <span class="brand-name">行動整合頁面</span>
        </div>
        <button id="sidebar-toggle-btn" class="icon-btn-ghost" title="縮小/展開側邊欄">
          <i class="ri-menu-fold-line"></i>
        </button>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">主要服務</div>
        <button class="nav-item active" data-view="bulletin" id="nav-bulletin">
          <i class="ri-newspaper-line"></i>
          <span class="nav-label">214 班電子佈告欄</span>
        </button>
        <button class="nav-item" data-view="fund" id="nav-fund">
          <i class="ri-wallet-3-line"></i>
          <span class="nav-label">214 班教材費專戶</span>
        </button>
        <button class="nav-item" data-view="grades" id="nav-grades">
          <i class="ri-graduation-cap-line"></i>
          <span class="nav-label">214 班學生成績查詢</span>
        </button>
        <button class="nav-item" data-view="island" id="nav-island">
          <i class="ri-community-line"></i>
          <span class="nav-label">島民行政中心</span>
        </button>

        <div class="nav-section-title">生產力工具</div>
        <button class="nav-item" id="btn-open-scratchpad">
          <i class="ri-sticky-note-line"></i>
          <span class="nav-label">快速筆記</span>
        </button>
        <button class="nav-item" id="btn-open-pomodoro">
          <i class="ri-timer-flash-line"></i>
          <span class="nav-label">番茄鐘專注</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button class="nav-item" id="btn-open-settings">
          <i class="ri-settings-4-line"></i>
          <span class="nav-label">偏好設定與系統</span>
        </button>
        <div id="pwa-install-container" style="display: none;">
          <button id="pwa-install-btn" class="pwa-btn">
            <i class="ri-download-cloud-line"></i>
            <span>安裝為應用程式</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- 主工作區與頂部導覽 Header & Main Content -->
    <div class="main-wrapper">
      
      <!-- 頂部功能列 Header -->
      <header id="header" class="header">
        <div class="header-left">
          <button id="mobile-menu-toggle" class="icon-btn-ghost mobile-menu-btn" title="開啟選單">
            <i class="ri-menu-line"></i>
          </button>
          <h1 id="view-title" class="page-title">214 班電子佈告欄</h1>
        </div>
        <div class="header-right">
          <select id="sheets-shortcut-select" class="sheets-shortcut-select" title="快速開啟 214 班功能對應的 Google 試算表">
            <option value="" disabled selected>📊 雲端試算表捷徑...</option>
            <option value="https://docs.google.com/spreadsheets/d/1p2Ii2M8dOGdBffuLe0hvE40P6qmfj4SS55uQ4_9bQrQ/edit">📌 214 電子佈告欄試算表</option>
            <option value="https://docs.google.com/spreadsheets/d/18CZv9TNJHrUBiAGPUTti2pNuDEMMXwniXU9aBs_lsyQ/edit?gid=0#gid=0">💰 214 教材費專戶試算表</option>
            <option value="https://docs.google.com/spreadsheets/d/1PEzy-SibsTw-DXUacBEn4u8jvafyxhFO3EjDgMNJ-Gw/edit?gid=0#gid=0">🎓 214 成績查詢試算表</option>
          </select>
          <!-- 番茄鐘膠囊計時器（計時進行中才顯示） -->
          <div id="pomodoro-capsule" class="pomodoro-capsule" style="display:none;">
            <i class="ri-timer-flash-line"></i>
            <span id="header-timer-display" class="capsule-timer-display">25:00</span>
            <button id="header-timer-toggle" class="capsule-expand-btn" title="展開番茄鐘">
              <i class="ri-arrow-up-s-line"></i>
            </button>
          </div>
          <div id="cloud-sync-status" class="cloud-sync-status ready" title="100% 免登入之雲端自動即時同步">☁️ 雲端同步中</div>
        </div>
      </header>

      <!-- 主要工作區 Working Canvas -->
      <main id="workspace" class="workspace layout-tab">
        
        <!-- Module Panel 1: 214 班電子佈告欄 -->
        <section id="panel-bulletin" class="module-panel panel-bulletin active-tab" data-module="bulletin">
          <div class="panel-body" id="bulletin-container">
            <!-- Bulletin Content JS Rendered -->
          </div>
        </section>

        <!-- Module Panel 2: 214 班教材費專戶 -->
        <section id="panel-fund" class="module-panel panel-fund" data-module="fund">
          <div class="panel-body" id="fund-container">
            <!-- Fund Content JS Rendered -->
          </div>
        </section>

        <!-- Module Panel 3: 214 班學生成績查詢 -->
        <section id="panel-grades" class="module-panel panel-grades" data-module="grades">
          <div class="panel-body" id="grades-container">
            <!-- Grades Content JS Rendered -->
          </div>
        </section>

        <!-- Module Panel 4: 島民行政中心 -->
        <section id="panel-island" class="module-panel panel-island" data-module="island">
          <div class="panel-body" id="island-container">
            <!-- Island Content JS Rendered -->
          </div>
        </section>

      </main>

      <!-- 全局常駐底部音樂廣播播放列 (Sticky Mini Radio Player) -->
      <div id="sticky-radio-player" class="sticky-radio-player">
        <div class="radio-mini-left">
          <button id="sticky-play-btn" class="sticky-play-btn" title="播放 / 暫停廣播">
            <i id="sticky-play-icon" class="ri-play-fill"></i>
          </button>
          <div class="equalizer-bars" id="sticky-equalizer">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="sticky-meta">
            <div id="sticky-station-title" class="sticky-title">🎷 SmoothJazz.com Global Radio</div>
            <div id="sticky-status-text" class="sticky-status">點擊播放，即刻收聽線上廣播</div>
          </div>
        </div>

        <div class="radio-mini-right">
          <select id="sticky-station-select" class="sticky-station-select" title="切換音樂電台頻道">
            <!-- Dynamic Station Options JS Rendered -->
          </select>
          <div class="volume-group sticky-volume">
            <i class="ri-volume-down-line volume-icon"></i>
            <input type="range" id="sticky-volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="0.8">
          </div>
        </div>

        <audio id="radio-audio-element" preload="none" src="https://smoothjazz.cdnstream1.com/2585_128.mp3"></audio>
      </div>
    </div>

  </div>

  <!-- 行動裝置底部導航列 (Mobile Bottom Navigation Bar) -->
  <nav id="bottom-nav" class="bottom-nav">
    <button class="bottom-nav-item active" data-view="bulletin" id="bn-bulletin">
      <i class="ri-newspaper-line"></i>
      <span>佈告欄</span>
    </button>
    <button class="bottom-nav-item" data-view="fund" id="bn-fund">
      <i class="ri-wallet-3-line"></i>
      <span>教材費</span>
    </button>
    <button class="bottom-nav-item" data-view="grades" id="bn-grades">
      <i class="ri-graduation-cap-line"></i>
      <span>成績</span>
    </button>
    <button class="bottom-nav-item" data-view="island" id="bn-island">
      <i class="ri-community-line"></i>
      <span>行政</span>
    </button>
    <button class="bottom-nav-item" id="bn-more">
      <i class="ri-more-2-fill"></i>
      <span>更多</span>
    </button>
  </nav>

  <!-- Drawers / Modals -->

  <!-- 生產力 - 快速筆記抽屜 Quick Scratchpad Drawer -->
  <div id="scratchpad-drawer" class="drawer drawer-right">
    <div class="drawer-header">
      <h3><i class="ri-sticky-note-line"></i> 快速筆記 (Quick Scratchpad)</h3>
      <button class="close-drawer-btn" id="close-scratchpad-btn"><i class="ri-close-line"></i></button>
    </div>
    <div class="drawer-body">
      <textarea id="scratchpad-textarea" placeholder="在此輸入隨手筆記，內容將自動儲存..."></textarea>
      <div class="drawer-actions">
        <button id="clear-scratchpad-btn" class="btn btn-secondary">清空筆記</button>
        <button id="copy-scratchpad-btn" class="btn btn-primary">複製筆記內容</button>
      </div>
    </div>
  </div>

  <!-- 生產力 - 番茄鐘彈窗 Modal -->
  <div id="pomodoro-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3><i class="ri-timer-flash-line"></i> 番茄鐘專注模式</h3>
        <button class="close-modal-btn" id="close-pomodoro-modal"><i class="ri-close-line"></i></button>
      </div>
      <div class="modal-body pomodoro-body">
        <div class="timer-ring-container">
          <svg class="timer-ring" width="200" height="200">
            <circle class="timer-ring-bg" cx="100" cy="100" r="88" />
            <circle id="timer-ring-progress" class="timer-ring-progress" cx="100" cy="100" r="88" />
          </svg>
          <div class="timer-ring-text">
            <span id="modal-timer-display" class="timer-digits">25:00</span>
            <span id="modal-timer-phase" class="timer-phase">工作時間</span>
          </div>
        </div>
        <div class="pomodoro-controls">
          <button id="pomo-start-btn" class="btn btn-primary btn-lg"><i class="ri-play-fill"></i> 開始專注</button>
          <button id="pomo-pause-btn" class="btn btn-secondary btn-lg" style="display:none;"><i class="ri-pause-fill"></i> 暫停</button>
          <button id="pomo-reset-btn" class="btn btn-ghost btn-lg"><i class="ri-restart-line"></i> 重置</button>
        </div>
        <div class="pomodoro-settings">
          <label><input type="checkbox" id="auto-focus-music-check" checked> 開啟專注計時時自動隨機連結音樂廣播電台播放</label>
        </div>
      </div>
    </div>
  </div>

  <!-- 設定面板 Drawer -->
  <div id="settings-drawer" class="drawer drawer-right">
    <div class="drawer-header">
      <h3><i class="ri-settings-4-line"></i> 偏好設定與系統</h3>
      <button class="close-drawer-btn" id="close-settings-btn"><i class="ri-close-line"></i></button>
    </div>
    <div class="drawer-body">
      
      <div class="setting-group">
        <h4><i class="ri-palette-line"></i> 外觀主題與色彩</h4>
        <div class="field-group">
          <label for="select-theme">系統視覺色彩風格主題</label>
          <select id="select-theme">
            <optgroup label="✨ 新增風格推薦">
              <option value="theme-obsidian-amber">極簡黑曜 · 琥珀暖金 (Obsidian & Warm Amber)</option>
              <option value="theme-nordic-pine">北歐松針 · 鼠尾草綠 (Nordic Pine & Sage)</option>
              <option value="theme-nebula-teal">星系曜紫 · 薄荷電光青 (Nebula Violet & Mint Teal)</option>
              <option value="theme-japanese-linen">和風燕麥 · 焙茶米白 (Japanese Linen & Oolong)</option>
            </optgroup>
            <optgroup label="經典莫蘭迪">
              <option value="theme-dark" selected>莫蘭迪霧藍 · 質感灰藍夜 (Morandi Slate Blue Dark)</option>
              <option value="theme-light">莫蘭迪霧藍 · 清爽天空白 (Morandi Slate Light)</option>
              <option value="theme-terracotta">莫蘭迪陶土 · 風化暖陶 (Morandi Terracotta)</option>
            </optgroup>
          </select>
        </div>
      </div>

      <div class="setting-group">
        <h4><i class="ri-database-2-line"></i> 系統備份與重置</h4>
        <div class="btn-group-row">
          <button id="btn-export-config" class="btn btn-secondary btn-sm"><i class="ri-download-line"></i> 匯出設定檔</button>
          <button id="btn-reset-all" class="btn btn-ghost btn-sm text-danger"><i class="ri-refresh-line"></i> 重置全站</button>
        </div>
      </div>

    </div>
  </div>

  <div id="modal-overlay" class="modal-overlay"></div>

  <!-- JavaScript Modules -->
  <script type="module" src="js/app.js?v=57"></script>
</body>
</html>
